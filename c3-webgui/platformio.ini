; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
lib_deps =
	https://github.com/mathieucarbou/AsyncTCP.git
	https://github.com/mathieucarbou/ESPAsyncWebServer.git
	arduino-libraries/Ethernet@^2.0.2

; Same firmware, pushed over the W5500 -> switch -> Bullet M2 link instead of
; USB. `pio run -e ota -t upload`. The address is the car's, not a serial port;
; PlatformIO just hands whatever upload_port says to the command below.
;
; USB stays the recovery path: if an image ever comes up unable to reach the
; network, `pio run -e esp32-c3-supermini -t upload` still works over ttyACM0.
[env:ota]
extends = env:esp32-c3-supermini
upload_protocol = custom
upload_port = 192.168.1.77
upload_command = python3 $PROJECT_DIR/ota_push.py $UPLOAD_PORT $SOURCE
